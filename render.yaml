# Render Blueprint — lets you provision the API + a Postgres database
# together via "New +" -> "Blueprint" in the Render dashboard, instead of
# clicking through each setting by hand. See DEPLOYMENT.md for the full
# walkthrough either way.

databases:
  - name: attendance-db
    plan: free
    databaseName: attendance
    user: attendance

services:
  - type: web
    name: attendance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_NAME
        value: "Attendance System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: UTC
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: ATTENDANCE_PHOTOS_DISK
        value: public
      # ---- Gmail SMTP for the forgot-password code email ----
      # MAIL_USERNAME / MAIL_PASSWORD are marked sync: false so Render won't
      # store them in this file or in git — you paste them into the
      # service's Environment tab in the Render dashboard instead.
      # MAIL_PASSWORD is a Gmail "App Password" (needs 2-Step Verification
      # enabled): https://myaccount.google.com/apppasswords
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Attendance System"
      - key: COMPANY_WORK_START
        value: "09:00"
      - key: COMPANY_WORK_END
        value: "18:00"
      - key: COMPANY_LATE_GRACE_MINUTES
        value: "10"
      # Set this to your real Vercel URL after the frontend is deployed,
      # e.g. https://your-app.vercel.app (comma-separate multiple origins).
      - key: FRONTEND_URL
        value: "http://localhost:5500"
